<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vernox — Laser-cut metal wall art, made to order in India</title>
    <meta name="description" content="Vernox makes laser-cut metal wall art to order in India. Choose a design or create your own, in steel, brass, copper and more, with delivery across India." />
    <meta name="author" content="Vernox" />
    <meta name="theme-color" content="#F4F2EE" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Start the storefront's data (src/lib/data/publicCatalog.ts) with the HTML instead of after the app has
         loaded. Same URL, mode and credentials as the app's fetch, so the browser reuses this response. -->
    <link rel="preload" href="/api/catalog" as="fetch" crossorigin="anonymous" fetchpriority="low" />

    <!-- Fonts: Cormorant Garamond (display serif), Plus Jakarta Sans (UI/body), JetBrains Mono (technical specs) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Fallback tags for crawlers that do not run JS; the app overrides them per page (src/lib/seo).
         %VITE_SITE_URL% is replaced at build time; set it in the environment (see .env.example). -->
    <meta property="og:site_name" content="Vernox" />
    <meta property="og:title" content="Vernox — Laser-cut metal wall art, made to order in India" />
    <meta property="og:description" content="Laser-cut metal wall art, made to order in India. Choose a design or create your own." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%VITE_SITE_URL%/images/hero-penthouse-brass.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/images/hero-penthouse-brass.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
