# Production stack: the app (SPA + API + scheduled jobs in one Node process) behind Caddy, which terminates
# HTTPS (automatic Let's Encrypt certificates). Run through ./install.sh, or directly:
#   docker compose --env-file .env.production up -d --build
# The database is Firebase (Firestore); there is no database container. For local development with the
# Firestore emulator use docker-compose.dev.yml (DOCKER.md); never use that for production.
name: vernox

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vernox-app:local
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "3001"
    # Reachable only from Caddy on the compose network. Publishing it would let clients spoof x-real-ip.
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 640m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  # Certificates and the ACME account: keep this volume, or Let's Encrypt rate limits can bite on re-creation.
  caddy_data:
  caddy_config:
